[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calcium-denoiser-audit"
version = "1.2.0"
description = "Ground-truth-aware fidelity and failure-mode audit commands for denoised movies"
readme = "docs/AUDIT_DENOISER_CLI.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Seyed Ali Mousavi" },
  { name = "Majid Badieirostami", email = "mbadiei@ut.ac.ir" },
]
maintainers = [
  { name = "Majid Badieirostami", email = "mbadiei@ut.ac.ir" },
]
keywords = [
  "biomedical-software",
  "evaluation-contracts",
  "evidence-admissibility",
  "reproducibility",
  "provenance",
  "fail-closed",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Operating System :: Microsoft :: Windows",
]
# TODO: add project URLs when the repository and archival DOI exist.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "tifffile>=2023.7.10",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.10"]
movie = ["opencv-python>=4.8"]
ecg = ["wfdb>=4.1"]
test = ["pytest>=8.0", "wheel>=0.42", "setuptools>=69", "hypothesis>=6.100"]

[project.scripts]
audit_denoiser = "audit_denoiser.cli:main"
audit_denoiser_fixture = "audit_denoiser.fixture:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["audit_denoiser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
